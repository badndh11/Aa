workflows:
  remote-mac:
    name: Remote Mac (Moonlight + VNC)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - remote
    scripts:
      - name: Tailscale
        script: |
          brew install tailscale
          sudo tailscaled install-system-daemon
          sudo tailscale up --authkey=$TS_AUTHKEY --hostname=codemagic-mac --accept-dns=false
          tailscale ip -4

      - name: VNC fallback
        script: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -clientopts -setvncpw -vncpw "$VNC_PW"

      - name: Speed tweaks
        script: |
          defaults write NSGlobalDomain NSAutomaticWindowAnimationsEnabled -bool false
          defaults write NSGlobalDomain NSWindowResizeTime -float 0.001
          defaults write com.apple.dock launchanim -bool false
          defaults write com.apple.dock expose-animation-duration -float 0
          defaults write com.apple.finder DisableAllAnimations -bool true
          defaults write com.apple.universalaccess reduceMotion -bool true || true
          defaults write com.apple.universalaccess reduceTransparency -bool true || true
          killall Dock Finder || true
          brew install displayplacer || true
          displayplacer list || true
          displayplacer "id:1 res:1280x720 hz:60 color_depth:8" || true
          caffeinate -dimsu &

      - name: Check SIP and try permissions
        script: |
          csrutil status || true
          SUN_BIN="$(brew --prefix)/bin/sunshine"
          brew tap LizardByte/homebrew
          brew install sunshine
          for DB in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            for SVC in kTCCServiceScreenCapture kTCCServiceAccessibility kTCCServicePostEvent; do
              sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version) VALUES ('$SVC','$SUN_BIN',1,2,4,1);" || echo "TCC write failed for $SVC (SIP on, grant by hand over VNC)"
            done
          done

      - name: Start Sunshine
        script: |
          mkdir -p ~/.config/sunshine
          cat > ~/.config/sunshine/sunshine.conf <<EOF
          origin_web_ui_allowed = wan
          min_log_level = info
          EOF
          sunshine --creds "$SUN_USER" "$SUN_PW" || true
          nohup sunshine > /tmp/sunshine.log 2>&1 &
          sleep 8
          tail -n 30 /tmp/sunshine.log || true

      - name: Keep alive
        script: |
          IP=$(tailscale ip -4)
          echo "=============================="
          echo "Moonlight host:  $IP"
          echo "Pair PIN page:   https://$IP:47990/pin"
          echo "VNC fallback:    $IP:5900"
          echo "=============================="
          for i in $(seq 1 240); do
            sleep 30
            pgrep sunshine >/dev/null || (nohup sunshine > /tmp/sunshine.log 2>&1 &)
          done
