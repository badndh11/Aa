workflows:
  mac-remote:
    name: Mac Remote Session
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      groups:
        # Create this group in Codemagic UI (mark all as Secure):
        #   TS_AUTHKEY    - Tailscale reusable + ephemeral auth key
        #   MAC_PASSWORD  - password you'll type in Screens (user: builder)
        #   VNC_PASSWORD  - max 8 chars, fallback legacy VNC password
        #   GIT_PUSH_URL  - (optional) https://TOKEN@github.com/you/backup.git
        - remote_access
      vars:
        SESSION_MINUTES: "112"   # keep-alive length; must be < max_build_duration

    # Brew downloads get reused on later runs (saved only on a successful finish)
    cache:
      cache_paths:
        - $HOME/Library/Caches/Homebrew

    scripts:
      - name: 1. Install and start Tailscale
        script: |
          set -e
          brew install tailscale
          sudo tailscaled install-system-daemon || (sudo nohup tailscaled >/tmp/tailscaled.log 2>&1 &)
          sleep 5
          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname=codemagic-mac \
            --accept-dns=false
          echo "=========================================="
          echo "TAILSCALE IP: $(tailscale ip -4)"
          echo "=========================================="

      - name: 2. Enable Screen Sharing (no clicking, no permissions)
        script: |
          # Give the builder user a known password for Screens login
          sudo dscl . -passwd /Users/builder "$MAC_PASSWORD" || true

          # Apple built-in Screen Sharing (supports High Performance mode)
          sudo launchctl enable system/com.apple.screensharing || true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist || true

          # Remote Management (ARD) with legacy VNC password as fallback
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$VNC_PASSWORD" \
            -restart -agent -privs -all || true

          # Stop display sleep / lock
          sudo pmset -a displaysleep 0 sleep 0 disablesleep 1 || true
          caffeinate -dimsu &

      - name: 3. Your setup (edit me)
        script: |
          # Put anything you want ready every session here, e.g.:
          # git clone https://github.com/you/yourrepo.git ~/work
          # brew install node
          echo "Setup done"

      - name: 4. Keep alive (connect now)
        script: |
          END=$(( $(date +%s) + SESSION_MINUTES * 60 ))
          echo "Connect in Screens to: $(tailscale ip -4)  user: builder"
          echo "To end early and still save cache: ssh in and run: touch /tmp/stop"
          while [ "$(date +%s)" -lt "$END" ] && [ ! -f /tmp/stop ]; do
            # Optional backup every 5 min if GIT_PUSH_URL is set and ~/work is a repo
            if [ -n "$GIT_PUSH_URL" ] && [ -d "$HOME/work/.git" ]; then
              ( cd "$HOME/work" \
                && git add -A \
                && git -c user.name=bot -c user.email=bot@example.com commit -qm "autosave" \
                && git push -q "$GIT_PUSH_URL" HEAD:autosave --force ) || true
            fi
            sleep 300
          done
          echo "Session finished cleanly"
          exit 0
